name: Voix Chatterbox
on:
  push:
    paths: ["voix/jobs/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: voix
jobs:
  voix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-chatterbox-mtl-v1
      - name: Installer
        run: |
          pip install --quiet torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet chatterbox-tts
      - name: Generer
        run: python tools/voix.py
      - name: Enregistrer
        run: |
          git config user.name "studio-voix"
          git config user.email "studio-voix@users.noreply.github.com"
          git add voix/out voix/jobs
          git commit -m "Voix générées" || echo rien
          git pull --rebase -q && git push
