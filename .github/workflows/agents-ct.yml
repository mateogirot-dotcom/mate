name: Agents court terme (automatique, sans IA)
# Toutes les 10 minutes pendant la bourse de New York (heure UTC, couvre l'heure d'été et d'hiver).
# Argent fictif : aucun ordre réel, aucun courtier.
on:
  schedule:
    - cron: "*/10 13-20 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency: cours-live
jobs:
  ct:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet yfinance
      - run: python parquet-pea/cours_live.py
      - run: python parquet-pea/ct_auto.py
      - run: |
          git config user.name "parquet-donnees"
          git config user.email "parquet-donnees@users.noreply.github.com"
          git add parquet-pea/data/cours_live.json parquet-pea/data/agents_ct.json
          git commit -m "Cours en direct + agents court terme" || echo rien
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 3; done
