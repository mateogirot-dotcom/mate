name: Cours en direct (ville)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: cours-live
jobs:
  cours:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet yfinance
      - run: python parquet-pea/cours_live.py
      - run: |
          git config user.name "parquet-donnees"
          git config user.email "parquet-donnees@users.noreply.github.com"
          git add parquet-pea/data/cours_live.json
          git commit -m "Cours en direct" || echo rien
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 3; done
